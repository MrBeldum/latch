# Latch node — a virtual desktop on this VPS (or any Docker host) that
# other Latch machines on your Tailscale account can open.
#
# From the repository root:
#   cp deploy/node/env.example deploy/node/.env
#   # put a Tailscale auth key in .env
#   docker compose -f deploy/node/docker-compose.yml up -d --build
#
# Repeat with a different project name / TS_HOSTNAME for another container
# on the same host; each one is its own tailnet machine.

name: latch-node

services:
  node:
    build:
      context: ../..
      dockerfile: deploy/node/Dockerfile
    image: ${LATCH_IMAGE:-latch-node:local}
    container_name: ${LATCH_CONTAINER:-latch-node}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DISPLAY: ":1"
      SCREEN_SIZE: ${SCREEN_SIZE:-1920x1080x24}
    volumes:
      - node-config:/root/.config
      - node-local:/root/.local
      - node-tailscale:/var/lib/tailscale
    # Kernel networking carries both TCP control and UDP media on this node's
    # own tailnet address. No public port mappings are needed.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    # If publishing within a trusted network, map both 47850/tcp and 47850/udp.
    shm_size: "1gb"

volumes:
  node-config:
  node-local:
  node-tailscale:
