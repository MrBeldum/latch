# Latch node — a virtual desktop on this VPS (or any Docker host) that
# other Latch machines on your Tailscale account can open.
#
# From the repository root:
#   cp deploy/node/env.example deploy/node/.env
#   # put a Tailscale auth key in .env
#   docker compose -f deploy/node/docker-compose.yml up -d --build
#
# Repeat with a different project name / TS_HOSTNAME for another container
# on the same host; each one is its own tailnet machine.

name: latch-node

services:
  node:
    build:
      context: ../..
      dockerfile: deploy/node/Dockerfile
    image: ${LATCH_IMAGE:-latch-node:local}
    container_name: ${LATCH_CONTAINER:-latch-node}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DISPLAY: ":1"
      SCREEN_SIZE: ${SCREEN_SIZE:-1920x1080x24}
    volumes:
      - node-config:/root/.config
      - node-local:/root/.local
      - node-tailscale:/var/lib/tailscale
    # Tailscale with kernel networking: peers reach Latch Host from their own
    # tailnet address, which is what it checks before pairing a device or
    # answering at all. In userspace mode every peer would arrive from
    # 127.0.0.1 and look like this machine itself. The container keeps its
    # own network namespace, so it is still its own tailnet machine.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    # Reachable only through Tailscale. Do not publish GameStream ports on
    # the public internet.
    shm_size: "1gb"

volumes:
  node-config:
  node-local:
  node-tailscale:
