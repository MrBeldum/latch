[Unit]
Requires=latch-desktop.service
After=latch-desktop.service
Wants=pulseaudio.service

[Service]
Environment=DISPLAY=:1
Environment=XAUTHORITY=%t/latch.Xauthority
Environment=PATH=/usr/local/bin:/usr/bin:/bin
ExecStartPre=/bin/sh -c 'for i in $(seq 1 100); do xdpyinfo >/dev/null 2>&1 && exit 0; sleep 0.2; done; exit 1'
CPUWeight=1000
Restart=on-failure
RestartSec=3
