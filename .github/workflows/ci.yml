name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --locked --workspace --all-targets
      # The setup script is generated, so only a dump of it can be parsed.
      # Every plan shape, with names that need quoting, through the parser
      # of the Windows PowerShell that runs it; plus the shipped scripts.
      - name: PowerShell scripts parse
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LATCH_DUMP_EXE = "C:\Users\O'Brien `$lab\AppData\Local\Latch\latch-host.exe"
          $env:LATCH_DUMP_ADAPTER = "Ethernet 'Realtek' `"2`" `$(x)"
          $env:LATCH_DUMP_ADAPTER_DESC = "Realtek PCIe GbE (`"x`")"
          $out = Join-Path $env:RUNNER_TEMP "setup.ps1"
          $env:LATCH_DUMP_SETUP_SCRIPT = $out
          $stage = Join-Path $env:RUNNER_TEMP "stage.ps1"
          $env:LATCH_DUMP_STAGE_SCRIPT = $stage
          $uninstall = Join-Path $env:RUNNER_TEMP "uninstall.ps1"
          $env:LATCH_DUMP_UNINSTALL_SCRIPT = $uninstall
          cargo test -q --locked -p latch-host --lib the_generated_script_can_be_dumped_for_a_syntax_check
          if ($LASTEXITCODE -ne 0) { throw "dumping the setup script failed" }
          $files = @('scripts\install-host.ps1', 'scripts\setup-protection.ps1', 'scripts\test-setup-protection.ps1', $out, $stage, "$stage.launch.ps1", $uninstall, "$uninstall.user.ps1")
          foreach ($f in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; throw "$f does not parse" }
            Write-Host "parses: $f"
          }
      - name: setup rejects writable paths and reparse points
        shell: powershell
        run: scripts/test-setup-protection.ps1
      # Exercise cleanup on an isolated folder and a dummy service, twice.
      - name: retire the previous streaming service
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The real retirement guard checks every ancestor. RUNNER_TEMP
          # lives below the user-writable D:\a on hosted Windows runners.
          $fixture = Join-Path ([IO.Path]::GetPathRoot($env:SystemRoot)) ('LatchRetireSelftest-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $acl = New-Object Security.AccessControl.DirectorySecurity
          $acl.SetSecurityDescriptorSddlForm('O:BAG:BAD:P(A;OICI;FA;;;SY)(A;OICI;FA;;;BA)')
          Set-Acl -LiteralPath $fixture -AclObject $acl
          $old = Join-Path $fixture 'old-engine'
          $svc = 'LatchRetireSelftest'
          $script = Join-Path $env:RUNNER_TEMP 'retire.ps1'
          $env:LATCH_DUMP_RETIRE_SCRIPT = $script
          $env:LATCH_DUMP_RETIRE_OLD = $old
          $env:LATCH_DUMP_RETIRE_SERVICE = $svc
          cargo test -q --locked -p latch-host --lib the_retire_step_can_be_dumped_for_a_windows_run
          if ($LASTEXITCODE -ne 0) { throw "dumping the retire step failed" }
          New-Item -ItemType Directory -Force $old | Out-Null
          Set-Content -LiteralPath (Join-Path $old 'old-state.json') -Value '{}'
          sc.exe create $svc binPath= "$env:WINDIR\System32\cmd.exe" start= demand | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "dummy service creation failed" }
          if ((Get-Service -Name $svc).Status -ne 'Stopped') { throw "dummy service must start stopped" }
          foreach ($attempt in 1..2) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script
            if ($LASTEXITCODE -ne 0) { throw "retirement failed" }
            if (Test-Path -LiteralPath $old) { throw "old folder remains" }
          }
          if (Get-Service -Name $svc -ErrorAction SilentlyContinue) { throw "old service remains" }
          Remove-Item -LiteralPath $fixture -Recurse -Force
          exit 0
      # Setup's record of the power settings and --uninstall's
      # administrator part, on this throwaway runner: the rules and the
      # record go, the power settings come back, and a second run finds
      # nothing left to do. No adapter is named, so no network card is
      # touched.
      - name: uninstall reverses setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'run-setup.ps1'
          $uninstall = Join-Path $env:RUNNER_TEMP 'run-uninstall.ps1'
          $env:LATCH_DUMP_SETUP_SCRIPT = $setup
          $env:LATCH_DUMP_UNINSTALL_SCRIPT = $uninstall
          cargo test -q --locked -p latch-host --lib the_generated_script_can_be_dumped_for_a_syntax_check
          if ($LASTEXITCODE -ne 0) { throw "dumping the scripts failed" }
          function AcIndex($setting) {
            $hex = [regex]::Matches((powercfg /query SCHEME_CURRENT SUB_SLEEP $setting | Out-String), '0x[0-9a-fA-F]{8}')
            [Convert]::ToUInt32($hex[$hex.Count - 2].Value, 16)
          }
          powercfg /setacvalueindex SCHEME_CURRENT SUB_SLEEP STANDBYIDLE 1234
          powercfg /setacvalueindex SCHEME_CURRENT SUB_SLEEP HIBERNATEIDLE 4321
          powercfg /setactive SCHEME_CURRENT
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $setup | Out-Host
          if (-not (Test-Path 'HKLM:\SOFTWARE\Latch\Setup')) { throw "setup recorded nothing" }
          if ((AcIndex STANDBYIDLE) -ne 0) { throw "setup left the sleep timeout" }
          if (-not (netsh advfirewall firewall show rule name="Latch Host" | Select-String 'fd7a:115c:a1e0')) { throw "the rule lacks Tailscale's IPv6 range" }
          foreach ($attempt in 1..2) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $uninstall | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "uninstall failed (run $attempt)" }
          }
          if ((AcIndex STANDBYIDLE) -ne 1234 -or (AcIndex HIBERNATEIDLE) -ne 4321) { throw "the power settings were not put back" }
          if (Test-Path 'HKLM:\SOFTWARE\Latch\Setup') { throw "the record remains" }
          foreach ($rule in 'Latch Host', 'Latch Media', 'Latch wake') {
            netsh advfirewall firewall show rule name="$rule" | Out-Null
            if ($LASTEXITCODE -eq 0) { throw "$rule remains" }
          }
          exit 0
      - name: release build
        run: cargo build --locked --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: latch-host-windows
          path: target/release/latch-host.exe
          if-no-files-found: error

  test-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # FFmpeg decodes the VideoToolbox encoder's output in the tests: an
      # independent decoder, never part of Latch.
      - name: ffmpeg for the encoder tests
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --locked --workspace --all-targets
      - name: release app
        run: cargo build --locked --release -p latch-host --target aarch64-apple-darwin
      - name: bundle
        run: bash scripts/bundle-macos.sh

  # Test both common VPS architectures.
  test-linux:
    name: test-linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: native deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --locked --workspace --all-targets
      - name: release host
        run: cargo build --locked --release -p latch-host
      - uses: actions/upload-artifact@v4
        with:
          name: latch-host-linux-${{ matrix.arch }}
          path: target/release/latch-host
          if-no-files-found: error

  deploy-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: node kit selftest
        run: bash deploy/node/selftest.sh
  native-display-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y xauth
      - run: bash deploy/native/selftest.sh
  relay-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: relay installer selftest
        run: bash deploy/relay/selftest.sh

  # Nothing Latch builds may compile C, C++ or assembler (docs/ENGINE.md).
  native-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: no C, C++ or assembler in the build graph
        run: bash scripts/audit-native.sh

  # The H.264 decoder against the ITU-T H.264.1 conformance bitstreams:
  # every picture must equal the reference decoder's output byte for byte.
  codec-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fetch the conformance bitstreams
        run: sh scripts/fetch-h264-conformance.sh
      - name: decode them
        run: cargo test --locked --release -p latch-codec --test conformance -- --nocapture
