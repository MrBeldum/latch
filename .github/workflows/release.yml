name: release

# Two ways in:
#   * workflow_dispatch: build the binaries and leave them on the run page.
#   * a v* tag: the same binaries, published as a GitHub release. The tag has
#     to be the workspace version (Cargo.toml) with a v in front.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Never ship a binary whose tests were not run.
      - name: test
        run: cargo test --locked --workspace
      - name: build app
        run: cargo build --locked --release -p latch-host --target aarch64-apple-darwin
      # bundle-macos.sh ad-hoc signs and verifies the bundle itself.
      - name: bundle
        run: bash scripts/bundle-macos.sh
      # A Mac refuses an update whose bundle says another version than the
      # release, deletes the download and fetches it again 15 minutes later.
      - name: bundle version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          have="$(/usr/bin/plutil -extract CFBundleShortVersionString raw dist.noindex/Latch.app/Contents/Info.plist)"
          [ "$have" = "${GITHUB_REF_NAME#v}" ] || { echo "::error::tag ${GITHUB_REF_NAME} but the bundle says ${have}; bump the version in Cargo.toml"; exit 1; }
      - name: package
        run: |
          cp docs/MACOS.md dist.noindex/README-MACOS.md
          cp LICENSE NOTICE dist.noindex/
          cd dist.noindex && tar czf latch-macos-arm64.tar.gz Latch.app README-MACOS.md LICENSE NOTICE
      # A 4.0 updater downloads only its original archive and app names.
      # The same app under that folder name lets it update at all; on its
      # first run it moves itself to Latch.app
      # and takes over the launch agent (crates/host/src/unix_setup.rs,
      # adopt_legacy_bundle). Nothing in 4.1 or later reads this asset.
      - name: package for 4.0 updaters
        run: |
          mkdir dist.noindex/legacy
          ditto dist.noindex/Latch.app dist.noindex/legacy/BroLink.app
          cp docs/MACOS.md dist.noindex/legacy/README-MACOS.md
          cp LICENSE NOTICE dist.noindex/legacy/
          cd dist.noindex/legacy && tar czf ../brolink-macos-arm64.tar.gz BroLink.app README-MACOS.md LICENSE NOTICE
      - uses: actions/upload-artifact@v4
        with:
          name: latch-macos-arm64
          path: |
            dist.noindex/latch-macos-arm64.tar.gz
            dist.noindex/brolink-macos-arm64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --locked --workspace
      - name: build
        run: cargo build --locked --release -p latch-host
      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\latch-host.exe dist\
          Copy-Item docs\WINDOWS.md dist\README-WINDOWS.md
          Copy-Item scripts\install-host.ps1, LICENSE, NOTICE dist\
          Compress-Archive -Path dist\* -DestinationPath latch-windows-x64.zip
      # A 4.0 Mac takes the host executable from its original archive and
      # sends it to each PC. The new program under the old name is what lets
      # it update the PC; nothing in 4.1 or later reads this asset.
      - name: package for 4.0 updaters
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force legacy | Out-Null
          Copy-Item target\release\latch-host.exe legacy\brolink-host.exe
          Copy-Item docs\WINDOWS.md legacy\README-WINDOWS.md
          Copy-Item scripts\install-host.ps1, LICENSE, NOTICE legacy\
          Compress-Archive -Path legacy\* -DestinationPath brolink-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: latch-windows-x64
          path: |
            latch-windows-x64.zip
            brolink-windows-x64.zip
          if-no-files-found: error

  # The Linux host, for VPS desktops: both production ones are arm64, x64 is
  # the other common kind. Built on Ubuntu 24.04 like CI, so it needs glibc
  # 2.39 or later. The Mac does not push updates to Linux hosts; they install
  # from here (deploy/native/README.md) and check the published SHA-256.
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: native deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: test
        run: cargo test --locked --workspace
      - name: build
        run: cargo build --locked --release -p latch-host
      - name: package
        run: |
          name="latch-host-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/latch-host LICENSE NOTICE "dist/$name/"
          cp -R deploy/native "dist/$name/native"
          tar -C dist -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: latch-host-linux-${{ matrix.arch }}
          path: |
            latch-host-linux-${{ matrix.arch }}.tar.gz
            latch-host-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    # Tags only: a manual run just leaves artifacts on the run page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout first: it empties the workspace, so artifacts downloaded
      # before it would be deleted.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md
            Cargo.toml
          sparse-checkout-cone-mode: false
      # The release is named after the tag and every program reports the
      # workspace version: a tag pushed before the bump would publish a
      # release no Mac can update to. Read the way bundle-macos.sh reads it.
      - name: tag matches the workspace version
        run: |
          have="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          [ "$have" = "${GITHUB_REF_NAME#v}" ] || { echo "::error::tag ${GITHUB_REF_NAME} but Cargo.toml says ${have}"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: release notes
        # The CHANGELOG.md section whose heading is this version, up to
        # the next heading. A tag without one gets GitHub's generated notes.
        run: |
          awk -v want="${GITHUB_REF_NAME#v}" '
            /^## / { on = ($2 == want); next }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            echo "NOTES=--notes-file notes.md" >> "$GITHUB_ENV"
          else
            echo "no CHANGELOG.md section for ${GITHUB_REF_NAME}; using generated notes"
            echo "NOTES=--generate-notes" >> "$GITHUB_ENV"
          fi
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) PRE=--prerelease ;;
            *)   PRE= ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Latch ${GITHUB_REF_NAME}" \
            $NOTES \
            $PRE \
            artifacts/*/*
