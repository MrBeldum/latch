[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/proto",
    "crates/codec",
    "crates/engine",
    "crates/stream",
    "crates/host",
    "crates/client",
    "crates/ui",
]

[workspace.package]
version = "5.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Latch Contributors"]
description = "Your machines, on any of your machines"
repository = "https://github.com/MrBeldum/latch"
homepage = "https://github.com/MrBeldum/latch"
readme = "README.md"

[workspace.dependencies]
latch-core = { path = "crates/core", version = "5.1.0" }
latch-proto = { path = "crates/proto", version = "5.1.0" }
latch-codec = { path = "crates/codec", version = "5.1.0" }
latch-engine = { path = "crates/engine", version = "5.1.0" }
latch-stream = { path = "crates/stream", version = "5.1.0" }
latch-ui = { path = "crates/ui", version = "5.1.0" }
latch-client = { path = "crates/client", version = "5.1.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = "0.8"
directories = "5"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "x11", "wayland"] }
egui = "0.31"
egui-wgpu = "0.31"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
# The decoders and the protocol engine are too slow unoptimised.
[profile.dev.package."*"]
opt-level = 2
