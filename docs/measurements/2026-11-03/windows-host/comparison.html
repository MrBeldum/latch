<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:var(--font-sans,system-ui);color:var(--foreground)}
#latch-metrics .legend{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px}
#latch-metrics .swatch{display:inline-block;width:16px;height:8px;margin-right:6px}
#latch-metrics .panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px}
#latch-metrics h3{font:inherit;font-weight:500;margin:0 0 12px}
#latch-metrics .chart{height:320px;display:grid;grid-template-rows:repeat(7,1fr)}
#latch-metrics .row{display:grid;grid-template-columns:86px 1fr;align-items:center;gap:8px}
#latch-metrics .bars{display:grid;gap:3px}
#latch-metrics .bar{display:grid;grid-template-columns:1fr 44px;gap:6px;align-items:center}
#latch-metrics .track{height:9px;background:var(--muted)}
#latch-metrics .mark{height:9px}
#latch-metrics .before{background:var(--chart-2)}
#latch-metrics .after{background:var(--chart-1)}
#latch-metrics .value{font-variant-numeric:tabular-nums;text-align:right}
#latch-metrics .axis{display:flex;justify-content:space-between;margin:8px 50px 0 94px;color:var(--muted-foreground)}
</style></head><body>

<script>
const root=document.getElementById('latch-metrics');
const rows=JSON.parse(document.getElementById('data').textContent);
for(const [field,title,unit,digits] of [['fps','Decoded frame rate · higher is better','fps',1],['host_ms','Capture → send · lower is better','ms',2]]){
 const panel=document.createElement('section');const h=document.createElement('h3');h.textContent=title;panel.append(h);
 const chart=document.createElement('div');chart.className='chart';chart.setAttribute('role','img');
 const max=Math.ceil(Math.max(...rows.flatMap(r=>[r.before[field],r.after[field]]))*1.1);
 chart.setAttribute('aria-label',title+'. '+rows.map(r=>r.label+': '+r.before[field].toFixed(digits)+' before, '+r.after[field].toFixed(digits)+' after '+unit).join('; '));
 for(const r of rows){const line=document.createElement('div');line.className='row';const label=document.createElement('span');label.textContent=r.label;line.append(label);const bars=document.createElement('div');bars.className='bars';
  for(const phase of ['before','after']){const bar=document.createElement('div');bar.className='bar';const track=document.createElement('div');track.className='track';const mark=document.createElement('div');mark.className='mark '+phase;mark.style.width=(r[phase][field]/max*100)+'%';track.append(mark);const val=document.createElement('span');val.className='value';val.textContent=r[phase][field].toFixed(digits);bar.append(track,val);bars.append(bar)}line.append(bars);chart.append(line)}
 panel.append(chart);const axis=document.createElement('div');axis.className='axis';axis.innerHTML='<span>0</span><span>'+max+' '+unit+'</span>';panel.append(axis);root.querySelector('.panels').append(panel);
}
