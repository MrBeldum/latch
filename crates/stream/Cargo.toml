[package]
name = "latch-stream"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The viewer side of a Latch stream: session, video decode, audio playback"

[dependencies]
mio = { version = "1", features = ["net", "os-poll"] }
latch-core.workspace = true
latch-proto.workspace = true
latch-codec.workspace = true
anyhow.workspace = true
tracing.workspace = true
rand.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
# Sound out through the OS mixer (CoreAudio, WASAPI, ALSA).
cpal = "0.18"

[target.'cfg(windows)'.dependencies]
# Media Foundation's H.264 decoder (DXVA when the GPU has it).
windows = { version = "0.58", features = [
    # Gamepads through Windows.Gaming.Input.
    "Foundation_Collections",
    "Gaming_Input",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    # Sound out: the endpoint's speakers, and a low-latency shared stream.
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Gamepads through the GameController framework.
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-game-controller = { version = "0.3", features = ["block2", "dispatch2"] }
# Rumble through each pad's Core Haptics engines.
objc2-core-haptics = { version = "0.3", default-features = false, features = ["std", "block2", "CHHapticEngine", "CHHapticEvent", "CHHapticParameter", "CHHapticPattern", "CHHapticPatternPlayer"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Gamepads through evdev; pure Rust ioctls.
evdev = "0.13"
# The output device's channel map (cpal's own ALSA binding).
alsa = "0.11"

[dev-dependencies]
