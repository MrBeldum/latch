[package]
name = "latch-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The host side of a Latch stream: capture, encode, audio, input, and the session server"

[dependencies]
latch-proto.workspace = true
latch-codec.workspace = true
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
rand.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shm", "xfixes", "randr", "xtest", "damage"] }
libc = "0.2"
pulseaudio = "0.3.2"
futures = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
