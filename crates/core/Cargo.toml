[package]
name = "latch-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared pieces of Latch: the control API, Tailscale, wake packets"

[dependencies]
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
directories.workspace = true
if-addrs = "0.15"
# Release lookup and download from GitHub over HTTPS.
# Pure-Rust TLS with no C, C++ or external assembler (graviola uses Rust inline assembly).
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4.0"
webpki-roots = "1"
semver = "1"
sha2 = "0.10"
# Decodes and resizes the checked-in logo for the window and file icons.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO"] }
