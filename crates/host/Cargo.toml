[package]
name = "latch-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Latch: share this machine and connect to the others"
build = "build.rs"

[lib]
name = "latch_host"
path = "src/lib.rs"

[[bin]]
name = "latch-host"
path = "src/main.rs"

[dependencies]
latch-core.workspace = true
latch-client.workspace = true
latch-ui.workspace = true
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
clap.workspace = true
semver = "1"
eframe.workspace = true

[target.'cfg(not(windows))'.dependencies]
arboard = "3"

# The X screen size the engine captures (see streamer::capture_size).
# arboard already links it on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
# build.rs includes ../core/src/icon.rs by path, which decodes the logo.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
toml.workspace = true
# Renders the screens to PNGs without a display, so the UI can be reviewed
# from any machine. See the `snapshots` test module in app.rs.
egui_kittest = { version = "0.31", features = ["wgpu", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
