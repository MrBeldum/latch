[package]
name = "latch-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Latch: view and share machines on your tailnet"

[lib]
name = "latch_client"
path = "src/lib.rs"

[[bin]]
name = "latch-client"
path = "src/main.rs"

[dependencies]
latch-core.workspace = true
latch-proto.workspace = true
latch-stream.workspace = true
latch-ui.workspace = true
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
semver = "1"

# The versions winit already builds on: nothing new is compiled. Used to
# take ⌘Q and ⌘H back from the app menu during a stream, and to read the
# pasteboard's change count.
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.31"
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSPasteboard", "NSResponder"] }
objc2-foundation = { version = "0.2", features = ["NSString", "NSThread"] }

[dev-dependencies]
toml.workspace = true
egui_kittest = { version = "0.31", features = ["wgpu", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
